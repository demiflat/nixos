windowrule {
  name = windowrule-1
  workspace = 1 silent
  match:class = ^(firefox)$
}

windowrule {
  name = windowrule-2
  workspace = 2 silent
  match:class = ^(Gkrellm)$
}

windowrule {
  name = windowrule-3
  workspace = 4 silent
  match:class = ^(chromium-browser)$
}

windowrule {
  name = windowrule-4
  workspace = 6 silent
  match:class = ^(codium-url-handler)$
}

windowrule {
  name = windowrule-5
  workspace = 6 silent
  match:class = ^(codium)$
}

windowrule {
  name = windowrule-5
  workspace = 6 silent
  match:class = ^(code)$
}

windowrule {
  name = windowrule-6
  workspace = 8 silent
  match:class = ^(jetbrains-idea-ce)$
}

windowrule {
  name = windowrule-7
  workspace = 9 silent
  match:class = ^(transmission-gtk)$
}

windowrule {
  name = windowrule-8
  float = on
  size = (monitor_w*0.8)
  center = on
  match:title = ^(ranger)$
}

windowrule {
  name = windowrule-9
  match:class = ^(fcitx)$
  pseudo = true
}

windowrule {
  name = windowrule-10
  match:class = ^(ibus-ui-gtk3)$
  no_focus = true
  float = true
}

windowrule {
  name = windowrule-11
  match:class = ^(electron)$
  workspace = 6 silent
  no_focus = true
}

