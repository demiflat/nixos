# See https://wiki.hyprland.org/Configuring/Monitors/

#env = AQ_DRM_DEVICES,/dev/dri/card1

#displays
#$DISP1 = DP-1
#$DISP2 = DP-2
$DISP1 = DP-2
$DISP2 = DP-3
#monitor=,preferred,auto,auto
#monitor=$DISP1,2560x1440@240,0x0,1, bitdepth, 10, cm, wide
#monitor=$DISP2,2560x1440@240,2560x0,1, bitdepth, 10, cm, wide
#monitor=$DISP1,2560x1440@240,0x0,1, bitdepth, 10, cm, dp3
#monitor=$DISP2,2560x1440@240,2560x0,1, bitdepth, 10, cm, dp3
#monitor=$DISP1,2560x1440@240,0x0,1, bitdepth, 10, cm, hdr
#monitor=$DISP2,2560x1440@240,2560x0,1, bitdepth, 10, cm, hdr
monitor=$DISP1,2560x1440@240,0x0,1, bitdepth, 10, cm, hdredid
monitor=$DISP2,2560x1440@240,2560x0,1, bitdepth, 10, cm, hdredid
#monitor=$DISP1,2560x1440@240,0x0,1, bitdepth, 8, cm, dp3
#monitor=$DISP2,2560x1440@240,2560x0,1, bitdepth, 8, cm, dp3

render:cm_auto_hdr = 2
quirks:prefer_hdr = 1
