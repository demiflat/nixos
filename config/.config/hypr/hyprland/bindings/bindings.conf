# Example binds, see https://wiki.hyprland.org/Configuring/Binds/ for more
# bind = $mainMod, Q, exec, kitty
# bind = $mainMod, C, killactive,
# bind = $mainMod, M, exit,
# bind = $mainMod, E, exec, dolphin
# bind = $mainMod, V, togglefloating,
# bind = $mainMod, R, exec, wofi --show drun
# bind = $mainMod, P, pseudo, # dwindle
# bind = $mainMod, J, togglesplit, # dwindle

bind = $mainMod, Return, exec, $term
bind = $mainMod, Q, killactive,
bind = $mainMod SHIFT, E, exit,
bind = $mainMod, F, fullscreen,
#bind = CONTROL, Space, togglefloating,
bind = Ctrl SHIFT, F, togglefloating,
#bind = $mainMod, Space, exec, wofi --show drun --prompt="" --allow-images
#bind = $mainMod, Space, exec, hyprlauncher
bind = $mainMod, Space, exec, $menu
bind = $mainMod, P, pseudo, # dwindle
#bind = $mainMod, T, togglesplit, # dwindle
#bind = Ctrl+Alt, L, exec, swaylock -f -c 000000
#bind = Ctrl+Alt, L, exec, hyprlock --immediate-render
bind = Ctrl+Alt, L, exec, $lock

# Move focus with mainMod + arrow keys
bind = $mainMod, left, movefocus, l
bind = $mainMod, right, movefocus, r
bind = $mainMod, up, movefocus, u
bind = $mainMod, down, movefocus, d
bind = $mainMod, H, movefocus, l
bind = $mainMod, L, movefocus, r
bind = $mainMod, K, movefocus, u
bind = $mainMod, J, movefocus, d

#
bind = $mainMod, Tab, cyclenext

# move window
bind = $mainMod SHIFT, H, movewindow, l
bind = $mainMod SHIFT, L, movewindow, r
bind = $mainMod SHIFT, K, movewindow, u
bind = $mainMod SHIFT, J, movewindow, d
bind = $mainMod SHIFT, left, movewindow, l
bind = $mainMod SHIFT, right, movewindow, r
bind = $mainMod SHIFT, up, movewindow, u
bind = $mainMod SHIFT, down, movewindow, d

# resize submap (mode)
bind=SUPER,R,submap,resize
submap=resize
binde=,L,resizeactive,40 0
binde=,H,resizeactive,-40 0
binde=,K,resizeactive,0 -40
binde=,J,resizeactive,0 40
bind=,escape,submap,reset
bind=,Return,submap,reset
submap=reset

# Switch workspaces with mainMod + [0-9]
bind = $mainMod, 1, workspace, 1
bind = $mainMod, 2, workspace, 2
bind = $mainMod, 3, workspace, 3
bind = $mainMod, 4, workspace, 4
bind = $mainMod, 5, workspace, 5
bind = $mainMod, 6, workspace, 6
bind = $mainMod, 7, workspace, 7
bind = $mainMod, 8, workspace, 8
bind = $mainMod, 9, workspace, 9
bind = $mainMod, 0, workspace, 10

# next/prev workspace
bind = $mainMod, U, workspace, e-1
bind = $mainMod, I, workspace, e+1
bind = $mainMod SHIFT, U, movetoworkspace, e-1
bind = $mainMod SHIFT, I, movetoworkspace, e+1

# Move active window to a workspace with mainMod + SHIFT + [0-9]
bind = $mainMod SHIFT, 1, movetoworkspace, 1
bind = $mainMod SHIFT, 2, movetoworkspace, 2
bind = $mainMod SHIFT, 3, movetoworkspace, 3
bind = $mainMod SHIFT, 4, movetoworkspace, 4
bind = $mainMod SHIFT, 5, movetoworkspace, 5
bind = $mainMod SHIFT, 6, movetoworkspace, 6
bind = $mainMod SHIFT, 7, movetoworkspace, 7
bind = $mainMod SHIFT, 8, movetoworkspace, 8
bind = $mainMod SHIFT, 9, movetoworkspace, 9
bind = $mainMod SHIFT, 0, movetoworkspace, 10

# printscreen screen capture
#bind = , PRINT, exec, hyprshot -m window
#bind = , PRINT, exec, hyprshot -m region -o /home/dak/Screenshots
bind = $mainMod SHIFT, S, exec, hyprshot -m region -o /home/dak/Screenshots
#bind = $mainMod SHIFT, PRINT, exec, hyprshot -m region -o /home/dak/Screenshots

# Example special workspace (scratchpad)
bind = $mainMod, S, togglespecialworkspace, magic
bind = $mainMod SHIFT, S, movetoworkspace, special:magic

# sound
#bind = ,XF86AudioRaiseVolume, exec, pactl set-sink-volume @DEFAULT_SINK@ +5%
#bind = ,XF86AudioLowerVolume, exec, pactl set-sink-volume @DEFAULT_SINK@ -5%
#bind = ,XF86AudioMute, exec, pactl set-sink-mute @DEFAULT_SINK@ toggle
bind = ,XF86AudioRaiseVolume, exec, pw-volume change +2.5%
bind = ,XF86AudioLowerVolume, exec, pw-volume change -2.5%
bind = ,XF86AudioMute, exec, pw-volume mute toggle

# Scroll through existing workspaces with mainMod + scroll
bind = $mainMod, mouse_down, workspace, e+1
bind = $mainMod, mouse_up, workspace, e-1

# Move/resize windows with mainMod + LMB/RMB and dragging
bindm = $mainMod, mouse:272, movewindow
bindm = $mainMod, mouse:273, resizewindow

#clip gui
#bind = $mainMod, V, exec, cliphist list | wofi --dmenu | cliphist decode | wl-copy

#bind = SUPER, A, layoutmsg, preselect d
#bind = SUPER, Z, layoutmsg, preselect r
