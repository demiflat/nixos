# For all categories, see https://wiki.hyprland.org/Configuring/Variables/
input {
    kb_layout = us
    kb_variant =
    kb_model =
    kb_options =
    kb_rules =

    mouse_refocus = false
    follow_mouse = 1
    #follow_mouse = 0

    touchpad {
        natural_scroll = yes
    }

    natural_scroll = yes

    sensitivity = 0 # -1.0 - 1.0, 0 means no modification.
    #sensitivity = -1.0 # -1.0 - 1.0, 0 means no modification.
}

