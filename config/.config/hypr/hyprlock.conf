# https://github.com/lenarus/simpleStylishHyprlock/blob/main/hyprlock.conf 
background {
    monitor =
    #path = $HOME/Pictures/wallpaper #path to background image
    path = /home/dak/linux/wallpapers/f40-01-night.png
    blur_passes = 3
    contrast = 0.8916
    brightness = 0.8172
    vibrancy = 0.1696
    vibrancy_darkness = 0.0
}

general {
    ignore_empty_input = true
    immediate_render = true
}

label {
    monitor =
    #text = cmd[update:1000] echo "$(date +"%H:%M")" # get formatted date
    #text = cmd[update:1000] echo "$(date +"%Y.%m.%d %l:%M:%S%p")" # get formatted date
    text = cmd[update:1000] echo "$(date +"%Y.%m.%d")" # get formatted date
    color = rgba(255, 255, 255, 0.9)
    font_size = 88
    #font_family = JetBrains Mono Nerd Font Mono ExtraBold
    #font_family = FiraCode Nerd Font
    font_family = Inter Display
    position = 0, 200
    halign = center
    valign = center
}

label {
    monitor =
    #text = cmd[update:1000] echo "$(date +"%H:%M")" # get formatted date
    #text = cmd[update:1000] echo "$(date +"%Y.%m.%d %l:%M:%S%p")" # get formatted date
    text = cmd[update:1000] echo "$(date +"%l:%M:%S %p")" # get formatted date
    color = rgba(255, 255, 255, 0.9)
    font_size = 25
    #font_family = JetBrains Mono Nerd Font Mono ExtraBold
    #font_family = FiraCode Nerd Font
    font_family = Inter Display
    position = 0, 100
    halign = center
    valign = center
}

label {
    monitor =
    text = cmd[update:100] echo "$USER"
    #text = cmd[update:100] echo "$USER, $($HOME/.scripts/c_scripts/get_current_keyboard_layout)" # get current user name and current keyboard layout
    color = rgba(255, 255, 255, 0.9)
    font_size = 18
    #font_family = JetBrains Mono Nerd Font Mono
    font_family = Inter Display
    position = 0, -20
    halign = center
    valign = center
}

# INPUT FIELD
input-field {
    monitor =
    size = 100, 45
    outline_thickness = 1
    dots_size = 0.2 # Scale of input-field height, 0.2 - 0.8
    dots_spacing = 0.2 # Scale of dots' absolute size, 0.0 - 1.0
    dots_center = true
    outer_color = rgba(0, 0, 0, 0)
    inner_color = rgba(0, 0, 0, 0.5)
    font_color = rgb(200, 200, 200)
    fade_on_empty = false
    #font_family = JetBrains Mono Nerd Font Mono
    font_family = Inter Display
    placeholder_text = <span foreground="##cdd6f4"> password </span> #text for input password
    hide_input = false
    position = 0, -80
    halign = center
    valign = center
}
